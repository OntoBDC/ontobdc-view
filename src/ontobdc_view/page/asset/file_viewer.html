<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base href="../">
<title>File</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #0f172a;
    --muted: color-mix(in srgb, #0f172a 60%, transparent);
    --border: color-mix(in srgb, #0f172a 18%, transparent);
    --accent: #0284c7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --fg: #f8fafc;
      --muted: color-mix(in srgb, #f8fafc 60%, transparent);
      --border: color-mix(in srgb, #f8fafc 22%, transparent);
      --accent: #38bdf8;
    }
  }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  #app {
    display: flex;
    flex-direction: column;
    height: 100dvh;
  }
  header {
    display: none;
  }
  header button.back {
    all: unset;
    cursor: pointer;
    color: var(--accent);
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
  }
  header button.back:hover { text-decoration: underline; }
  header .name {
    font-size: 14px;
    font-weight: 700;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    min-width: 0;
  }
  main {
    flex: 1;
    min-height: 0;
    overflow: auto;
    display: flex;
  }
  main img {
    margin: auto;
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
  }
  main embed.pdf {
    flex: 1;
    border: 0;
  }
  table {
    border-collapse: collapse;
    font-size: 13px;
    width: 100%;
    align-self: flex-start;
  }
  th, td {
    padding: 6px 10px;
    text-align: start;
    white-space: nowrap;
    border-bottom: 1px solid var(--border);
  }
  th {
    position: sticky;
    top: 0;
    background: var(--bg);
    font-weight: 700;
  }
  .fallback {
    margin: auto;
    display: grid;
    place-items: center;
    gap: 10px;
    text-align: center;
    padding: 24px;
  }
  .fallback a {
    color: var(--accent);
    font-weight: 700;
    text-decoration: none;
  }
  .fallback a:hover { text-decoration: underline; }
  .fallback .muted { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
  <div id="app">
    <header>
      <button class="back" type="button">&larr; Surface</button>
      <span class="name" id="file-name"></span>
    </header>
    <main id="viewer"></main>
  </div>
  <script>
    // This page only exists so a real file is ever read: the main Surface
    // (index.html) never embeds file content, only RO-Crate metadata --
    // opening a file from its file tree navigates here, passing the path
    // as a query reference, and only then is the real file requested.
    const params = new URLSearchParams(location.search);
    const path = params.get("path") || "";
    const title = params.get("title") || (path.split("/").pop() || "File");
    document.title = title;
    document.getElementById("file-name").textContent = title;
    document.getElementById("file-name").title = path;

    const backButton = document.querySelector("button.back");
    if (backButton) {
      backButton.addEventListener("click", () => {
        const isFramed = window.self !== window.top;
        if (isFramed) {
          try {
            window.parent.postMessage({ type: "ontobdc:viewer:close-requested" }, "*");
          } catch (_) {
            // Cross-origin or access-restricted parent — ignore.
          }
          return;
        }
        if (window.history.length > 1) {
          window.history.back();
        }
      });
    }

    const viewer = document.getElementById("viewer");
    const extension = (path.split(".").pop() || "").toLowerCase();
    const IMAGE_EXTENSIONS = new Set(["png", "jpg", "jpeg", "gif", "webp", "bmp", "svg", "tif", "tiff"]);
    const rawHref = path || "";
    const href = rawHref
      .split("/")
      .map((segment) => encodeURIComponent(segment))
      .join("/");

    function renderFallback(message) {
      const wrap = document.createElement("div");
      wrap.className = "fallback";
      const label = document.createElement("div");
      label.className = "muted";
      label.textContent = message
        ? String(message)
        : extension
          ? `.${extension} file`
          : "File";
      const link = document.createElement("a");
      link.href = href;
      link.target = "_blank";
      link.rel = "noopener";
      link.textContent = "Open file in new tab";
      wrap.append(label, link);
      viewer.replaceChildren(wrap);
    }

    function parseCsv(text) {
      const rows = [];
      let row = [];
      let field = "";
      let inQuotes = false;
      for (let index = 0; index < text.length; index += 1) {
        const char = text[index];
        if (inQuotes) {
          if (char === '"' && text[index + 1] === '"') { field += '"'; index += 1; }
          else if (char === '"') { inQuotes = false; }
          else { field += char; }
          continue;
        }
        if (char === '"') inQuotes = true;
        else if (char === ",") { row.push(field); field = ""; }
        else if (char === "\n" || char === "\r") {
          if (char === "\r" && text[index + 1] === "\n") index += 1;
          row.push(field); field = ""; rows.push(row); row = [];
        } else field += char;
      }
      if (field.length || row.length) { row.push(field); rows.push(row); }
      return rows.filter((cells) => cells.some((cell) => cell.trim() !== ""));
    }

    function renderCsvTable(rows) {
      const [header, ...body] = rows;
      const table = document.createElement("table");
      const thead = document.createElement("thead");
      const headRow = document.createElement("tr");
      for (const cell of header) {
        const th = document.createElement("th");
        th.textContent = cell;
        headRow.appendChild(th);
      }
      thead.appendChild(headRow);
      table.appendChild(thead);
      const tbody = document.createElement("tbody");
      for (const cells of body) {
        const tr = document.createElement("tr");
        for (const cell of cells) {
          const td = document.createElement("td");
          td.textContent = cell;
          tr.appendChild(td);
        }
        tbody.appendChild(tr);
      }
      table.appendChild(tbody);
      viewer.replaceChildren(table);
    }

    if (!path) {
      renderFallback();
    } else if (IMAGE_EXTENSIONS.has(extension)) {
      const img = document.createElement("img");
      img.alt = title;
      img.src = href;
      img.addEventListener("error", () => renderFallback("Unable to load image"));
      viewer.replaceChildren(img);
    } else if (extension === "pdf") {
      const object = document.createElement("object");
      object.type = "application/pdf";
      object.data = `${href}#toolbar=0&view=FitH`;
      object.style.flex = "1";
      object.style.border = "0";
      object.style.width = "100%";
      object.style.height = "100%";
      object.innerHTML = `
        <iframe src="${href}#toolbar=0&view=FitH" style="flex:1;border:0;width:100%;height:100%;" title="${title}"></iframe>
      `;
      object.addEventListener(
        "error",
        () => renderFallback("PDF viewer blocked — open the file in a new tab using the link below"),
        { once: true },
      );
      viewer.replaceChildren(object);
    } else if (extension === "csv") {
      fetch(href)
        .then((response) => {
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          return response.text();
        })
        .then((text) => {
          const rows = parseCsv(text);
          if (!rows.length) throw new Error("empty CSV");
          renderCsvTable(rows);
        })
        .catch((error) => renderFallback(error && error.message ? error.message : "Unable to load CSV"));
    } else {
      renderFallback();
    }
  </script>
</body>
</html>
