[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "ontobdc-view"
version = "0.3.1"
description = "Browser presentation components and embeddable assets for OntoBDC views."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
  { name = "Elias Magalhaes" }
]
dependencies = [
    "hatchling>=1.26",
    "editables",
    "PyYAML>=6.0",
]
keywords = ["ontobdc", "web-components", "presentation", "offline", "html"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
# Browser-level closed-shadow-root Tile behavior (pin/unpin, bringToFront,
# scrolling, semantic-vs-legacy Surface topology) can't be verified from
# Python string assertions alone — see test/test_surface_browser.py.
test = ["pytest-playwright"]

[project.urls]
Homepage = "https://github.com/EliasMPJunior/ontobdc-view"
Repository = "https://github.com/EliasMPJunior/ontobdc-view"

[tool.hatch.build.targets.wheel]
packages = ["src/ontobdc_view"]

[tool.hatch.build.targets.wheel.package-data]
"*" = ["**/*.js", "**/*.css", "**/*.j2", "**/*.ttl", "**/*.yaml"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/test",
  "/README.md",
  "/LICENSE",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["test"]
